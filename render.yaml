services:
  - type: web
    name: degerix
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Bölge analizi için TCMB EVDS anahtarı; değeri Render panelinde girilir, depoya yazılmaz
      - key: EVDS_API_KEY
        sync: false
